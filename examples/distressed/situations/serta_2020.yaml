# Serta Simmons Bedding (private) — June 2020 Uptier ("Position Enhancement Transaction")
#
# A bundled worked example. Decision point: a ~51% majority lender group is
# offering us a seat in a super-priority "uptier" that primes the rest of the
# first lien. Do we join the majority and roll up — or stay out and risk being
# subordinated below ~$1.05B of new super-priority debt?
#
# This is the canonical liability-management / "lender-on-lender violence" case.
# It later went to Chapter 11 (Jan 2023, S.D. Tex.) and the Fifth Circuit
# (Dec 31, 2024) ultimately held the uptier was NOT a permitted "open market
# purchase" and violated the pro rata "sacred right."
#
# Figures grounded in: 5th Cir. opinion In re Serta Simmons Bedding (2024);
# Moody's & S&P rating actions; Serta press release 06/22/2020 (PRNewswire);
# Ch. 11 docket (S.D. Tex., filed 01/23/2023). Approximate figures marked
# "~approx"; gaps marked "unknown" rather than guessed.
#
# Run it:   quantai-credit run examples/distressed/situations/serta_2020.yaml

company: Serta Simmons Bedding
ticker: private
sector: Consumer durables / mattress manufacturing
situation_type: Out-of-court liability management (non-pro-rata uptier exchange)

thesis_one_liner: >-
  Classic uptier "lender-on-lender violence" — a ~51% majority can prime the
  minority via new super-priority debt, so the real question is not credit
  quality but whether you are inside or outside the controlling group.

current_position: Existing 1L term loan holder — must decide whether to join the uptier

# LTM EBITDA is not cleanly disclosed for Serta (private). ~$260M is the figure
# that reconciles Moody's two cited leverage points: >8x pre-uptier on ~$2.58B
# pre-deal debt (9.9x) and ~10.5x pro forma on ~$2.76B pro-forma debt (10.6x).
# Marked ~approx and derived, not reported — see operating_metrics.
ltm_ebitda_mm: 260.0   # ~approx, implied from Moody's leverage; not cleanly disclosed

# Capital structure modeled PRO FORMA for the June 2020 uptier (the structure
# we're voting to create). seniority: 1 = most senior. face_mm = outstanding
# principal in $MM.
#
# Teaching point: the new super-priority debt (ranks 1-2, ~$1.05B) primes the
# old term loans, pushing the non-participating 1L from the top of the term-loan
# stack down to rank 4. The ABL is modeled below the new super-priority for
# simplicity (in reality it is super-senior on a separate AR/inventory pool).
#
# NO double-count: the $850M FLSO "roll-up" is old 1L/2L *repositioned*, not new
# debt, so the old term loans are carried at their NON-participating residuals,
# not full face. Reconciliation: pre-deal 1L $1,900M + 2L $450M + ABL $225M =
# $2,575M. The uptier rolls ~$750M of 1L and ~$115M of 2L into the $850M FLSO
# and adds $200M new money → pro-forma $200 + $850 + $225 + $1,150 + $335 =
# $2,760M (≈ $2,575M + $200M new money, net of exchange discount). Residual
# splits are an illustrative ~51/49 apportionment (~approx).
capital_structure:
  # The uptier instruments. ~$865M of old 1L/2L face is exchanged into the
  # $850M FLSO at a discount; $200M new money sits on top.
  - name: NEW — Super-Priority First-Out Term Loan (new money)
    face_mm: 200.0
    coupon: Floating (Moody's-rated B2)
    maturity: Aug 2023
    seniority: 1   # new money, most senior — leapfrogs the entire old stack
    holder: Participating ("Prevailing") majority group

  - name: NEW — Super-Priority Second-Out Term Loan (FLSO roll-up)
    face_mm: 850.0   # Moody's $851MM; repositioned old 1L/2L (NOT additive to them)
    coupon: Floating (Moody's-rated Caa2)
    maturity: Aug 2023
    seniority: 2
    holder: Participating ("Prevailing") majority group

  - name: ABL Revolving Credit Facility
    face_mm: 225.0
    coupon: Floating (ABL grid; spread unknown)
    maturity: 2021 (unknown exact)
    seniority: 3
    holder: Bank group

  - name: First-Lien Term Loan (2016, non-participating residual)
    face_mm: 1150.0   # ~$1.9B face less ~$750M rolled into the FLSO ~approx
    coupon: LIBOR + 350
    maturity: Nov 2023
    seniority: 4   # PRIMED by the uptier — was senior, now behind ~$1.05B new super-priority
    holder: >-
      Non-participating minority — Apollo, Angelo Gordon, LCM, North Star
      (later "excluded" lenders who sued). The participating majority (Eaton
      Vance, Invesco, Credit Suisse AM, Barings) rolled its 1L into the FLSO.

  - name: Second-Lien Term Loan (2016, non-participating residual)
    face_mm: 335.0   # ~$450M face less ~$115M rolled into the FLSO ~approx
    coupon: LIBOR + spread (unknown; market reports materially wider than 1L)
    maturity: Nov 2024
    seniority: 5
    holder: Same syndicated CLO/credit-fund universe

# Chronological events. Mark the committee meeting with DECISION_POINT.
timeline:
  - date: "2016-11"
    event: >-
      Serta (Advent International-owned) raises $1.95B 1L TL (L+350, due 2023)
      + $450M 2L TL (due 2024) + $225M ABL. Credit agreement allows buybacks
      via "open market purchases" or pro-rata Dutch auctions — the language
      later litigated.
  - date: "2019-12-04"
    event: >-
      S&P downgrades 1L to CCC; 1L trading below 60, 2L around 30 cents.
      Leverage building above 8x.
  - date: "2020-03"
    event: >-
      COVID shutters mattress retail distribution; sharp budget shortfall and
      going-concern pressure trigger a scramble for liquidity.
  - date: "2020-Q2"
    event: >-
      Two competing rescue proposals emerge — an Apollo/Angelo Gordon "drop-down"
      plan vs. the ~51% majority "uptier." Serta picks the uptier.
  - date: DECISION_POINT
    event: >-
      THIS IS THE COMMITTEE MEETING — a ~51% majority group offers us a seat in
      the super-priority uptier (join and roll up at ~74c, or stay out and be
      primed below ~$1.05B of new super-priority debt). Decide.
  - date: "2020-06-22"
    event: >-
      Uptier closes. $200M new-money first-out + ~$850M second-out (FLSO) prime
      the non-participating lenders. Company claims >$400M debt reduction and
      >$300M cash. Excluded lenders (LCM, North Star) sue in NY.
  - date: "2023-01-23"
    event: >-
      Serta files prearranged Chapter 11 (S.D. Texas) with ~$1.9B funded debt;
      plan equitizes ~$1.59B, leaving ~$315M.
  - date: "2024-12-31"
    event: >-
      Fifth Circuit reverses — the uptier was NOT a permitted "open market
      purchase," violated the pro rata sacred right, and the plan indemnity for
      participants is excised; remanded for damages to excluded lenders.

operating_metrics:
  Revenue: ~$2.2B annually (Moody's, 2020) ~approx
  EBITDA: Not cleanly disclosed publicly — unknown
  Leverage: ">8x (Apr 2020); ~10.5x pro forma at uptier; projected ~13x within 12-18mo"
  Liquidity post-uptier: ">$300M cash (company) ~approx"
  Going-concern: YES — COVID demand/distribution shock drove the June 2020 deal
  Market position: One of the largest mattress makers in North America; ~27 plants
  Brands: Serta, Beautyrest, Simmons, Tuft & Needle, Tomorrow Sleep
  PE owner: Advent International (lost equity in the 2023 reorganization)
  Credit covenant at issue: pro rata "sacred right"; buyback carve-outs for "open market purchases" / Dutch auctions

key_risks:
  - >-
    If we stay OUT, we are primed below ~$1.05B of new super-priority debt and
    pushed to effective third/fourth lien — recovery could collapse.
  - >-
    If we join, we accept a ~74c exchange haircut and litigation exposure as a
    "Prevailing Lender" (the indemnity later struck down by the 5th Circuit).
  - >-
    Legal risk both ways — "open market purchase" interpretation was unsettled
    (Serta lost at the 5th Circuit in 2024; contrast Mitel in NY).
  - >-
    Pro forma leverage ~10.5x rising to ~13x — Moody's called the structure
    "not sustainable"; a follow-on restructuring was likely (and came in 2023).
  - COVID demand whipsaw — a 2020-21 stimulus rebound, then a 2022 downturn that precipitated Chapter 11.
  - Reputational / relationship risk of participating in non-pro-rata "lender-on-lender violence."

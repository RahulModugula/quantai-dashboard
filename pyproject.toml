[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantai-credit"
version = "0.2.0"
description = "An open-source, auditable AI distressed-credit committee: recovery waterfalls, fulcrum analysis, and IC memos from a YAML file"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "distressed-debt",
    "restructuring",
    "credit-analysis",
    "recovery-waterfall",
    "fulcrum-security",
    "llm-agents",
    "multi-agent",
    "fintech",
    "litellm",
]
# Core install is the distressed-credit committee only — model-agnostic LLM
# calls + YAML situations + pretty output. It does NOT pull the ML/data stack.
# The equity-research reference build lives behind the optional `equity` extra.
dependencies = [
    "litellm>=1.40.0",  # model-agnostic LLM calls (Claude / GPT / Grok / Ollama)
    "pyyaml>=6.0",      # parse situation .yaml files
    "rich>=13.0",       # terminal rendering for the snapshot / decision
]

[project.optional-dependencies]
# The full equity-research pipeline, API, and dashboard (the reference build
# that shows the same agent loop applied to equities). Heavy: torch, xgboost,
# lightgbm, dash, fastapi, ... Only needed for the equity system, never for the
# credit committee.
equity = [
    "yfinance>=0.2.36",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "pyportfolioopt>=1.5.0",
    "optuna>=3.5.0",
    "torch>=2.2.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "dash>=2.15.0",
    "dash-bootstrap-components>=1.5.0",
    "plotly>=5.18.0",
    "redis>=5.0.0",
    "a2wsgi>=1.10.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "joblib>=1.3.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "shap>=0.44.0",
    "aiohttp>=3.9.0",
    "feedparser>=6.0.0",
]
dev = [
    # Upper bounds guard against silent CI breakage on a new major release
    # (a pytest-asyncio jump previously broke the suite via event-loop handling).
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=4.1,<7",
    "pytest-timeout>=2.2,<3",
    "pytest-mock>=3.12,<4",
    "ruff>=0.2,<1",
]

[project.scripts]
quantai-credit = "examples.distressed.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "examples"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pin the fixture loop scope so pytest-asyncio 1.x behavior is deterministic
# (and to silence its unset-scope deprecation warning).
asyncio_default_fixture_loop_scope = "function"

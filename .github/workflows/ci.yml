name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  lint:
    name: Linting and Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check src/ tests/ examples/ scripts/

      - name: Run ruff formatter check
        run: ruff format src/ tests/ examples/ scripts/ --check

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[equity,dev]"

      - name: Run pytest
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov=examples \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short \
            --timeout=30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  credit:
    name: Credit committee (lightweight install, no ML stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Deliberately NO [equity] extra — this proves the credit committee runs
      # on litellm + pyyaml + rich alone (the launch claim).
      - name: Install credit committee only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run credit tests
        run: |
          pytest tests/test_distressed_credit.py tests/test_credit_correctness.py \
            tests/test_credit_snapshot.py tests/test_credit_situation_loader.py \
            tests/test_credit_tools_advanced.py tests/test_envision_2023.py \
            -v --tb=short --timeout=30

      - name: validate runs with no API key
        run: |
          quantai-credit validate examples/distressed/situations/ati_2023.yaml
          quantai-credit validate examples/distressed/situations/serta_2020.yaml
          quantai-credit validate examples/distressed/situations/hertz_2020.yaml

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit

      - name: Run Bandit security check
        run: bandit -r src/ -f json -o bandit-report.json -s B101 || true

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [lint, test, credit, security]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tools
        run: pip install build hatch

      - name: Build distribution
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
